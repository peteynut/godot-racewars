# RaceWars fork: builds the Windows D3D12 export templates (Mono/C#) that carry
# the DLSS / FSR 3-4 upscalers. This is the only workflow the fork needs; the
# stock upstream workflows can be removed on the fork to save CI minutes.
#
# Phase 2: dlss=yes ffx_upscaler=yes compile the NGX + ffx-api wrappers in.
# The NGX headers/lib come from NVIDIA's public DLSS SDK repo, fetched below
# (never committed). Runtime DLLs (nvngx_dlss.dll + AMD's signed DLLs) ship
# beside the exe via export.sh - Phase 4.
name: 🏎 RaceWars Windows Templates
on:
  workflow_dispatch:
  push:
    branches: [racewars-upscalers]

env:
  # Commit of github.com/NVIDIA/DLSS the wrappers were written against
  # (v310.7.0 line). Bump deliberately.
  DLSS_SDK_COMMIT: a291cc7d2cc642a51566f3dfd5376f635cd1b284
  SCONS_FLAGS: >-
    production=yes
    debug_symbols=no
    module_mono_enabled=yes
    module_text_server_fb_enabled=yes
    dlss=yes
    ffx_upscaler=yes
    "dlss_sdk_path=${{ github.workspace }}/dlss_sdk/"
    "angle_libs=${{ github.workspace }}/"
    "accesskit_sdk_path=${{ github.workspace }}/accesskit-c-0.21.2/"
  SCONS_CACHE_MSVC_CONFIG: true
  PYTHONIOENCODING: utf8

jobs:
  windows-mono-templates:
    runs-on: windows-latest
    name: Windows D3D12 Mono templates (x86_64)
    # A cold run compiles editor + both templates (~2h); give headroom over the
    # old 180 cap that a hung smoke step pushed us past.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: racewars-windows-mono-templates
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      # NGX headers + static lib for the DLSS wrapper (public repo, no NDA;
      # proprietary license forbids vendoring it into this repo).
      - name: Fetch NVIDIA DLSS SDK
        shell: pwsh
        run: |
          git init dlss_sdk
          cd dlss_sdk
          git remote add origin https://github.com/NVIDIA/DLSS.git
          git fetch --depth 1 origin $env:DLSS_SDK_COMMIT
          git checkout FETCH_HEAD
          if (!(Test-Path include/nvsdk_ngx.h)) { throw "DLSS SDK layout unexpected" }

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::error::D3D12 SDK install failed - DLSS/FSR require D3D12, aborting."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Download pre-built ANGLE static libraries
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-x86_64-msvc-release.zip
          target: angle/angle.zip
      - name: Extract pre-built ANGLE static libraries
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Download pre-built AccessKit
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-accesskit-c-static
          version: tags/0.21.2
          file: accesskit-c-0.21.2.zip
          target: accesskit-c-0.21.2/accesskit_c.zip
      - name: Extract pre-built AccessKit
        run: unzip -o accesskit-c-0.21.2/accesskit_c.zip

      # 1. Editor build is required only to generate the C# glue.
      - name: Build editor (for Mono glue)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
          platform: windows
          target: editor

      - name: Generate Mono glue
        run: ./bin/godot.windows.editor.x86_64.mono.exe --headless --generate-mono-glue ./modules/mono/glue

      # 2. The actual shippable templates.
      - name: Build template_release
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
          platform: windows
          target: template_release

      - name: Build template_debug
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
          platform: windows
          target: template_debug

      # 3. GodotSharp assemblies that ship beside the templates.
      - name: Build .NET assemblies
        run: python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=windows

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: racewars-windows-mono-templates
        continue-on-error: true

      - name: Prepare artifact
        run: Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force -ErrorAction SilentlyContinue

      - name: Upload templates
        uses: ./.github/actions/upload-artifact
        with:
          name: racewars-windows-mono-templates

      # Templates carry no project, so --version is the only self-contained check;
      # --headless --quit would try to load a project, print "pck missing" and hang.
      - name: Smoke test
        run: ./bin/godot.windows.template_release.x86_64.mono.console.exe --version
